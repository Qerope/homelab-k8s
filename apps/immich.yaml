apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
spec:
  replicas: 1
  selector:
    matchLabels: {app: immich-server}
  template:
    metadata:
      labels: {app: immich-server}
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v1.64.0
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
      volumes:
        - name: library
          nfs: {server: 192.168.1.5, path: /volume1/photos/immich}
