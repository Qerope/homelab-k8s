apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels: {app: jellyfin}
  template:
    metadata:
      labels: {app: jellyfin}
    spec:
      nodeSelector:
        kubernetes.io/hostname: nuc
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.8.4
          ports:
            - containerPort: 8096
