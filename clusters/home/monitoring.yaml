      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    grafana:
      ingress:
        enabled: true
        hosts: [grafana.home.example.com]
        tls:
          - secretName: grafana-tls
            hosts: [grafana.home.example.com]
    additionalPrometheusRulesMap:
      node-alerts:
        groups:
          - name: nodes
            rules:
              - alert: NodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 10m
                labels:
                  severity: warning
    alertmanager:
      config:
        route:
          receiver: ntfy
        receivers:
          - name: ntfy
            webhook_configs:
              - url: http://ntfy.monitoring.svc/homelab
